apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: emqx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://repos.emqx.io/charts
    targetRevision: 5.8.0
    chart: emqx
    helm:
      releaseName: emqx
      values: |
        # replicaCount stays 1. EMQX clustering was tried (D36) and measured to
        # be actively harmful on this hardware.
        #
        # With replicaCount 3 and DNS discovery the nodes do form a cluster --
        # all three report all three members -- but delivery collapses:
        #
        #   rate    replicaCount=1   replicaCount=3
        #   3000/s  100.0%             2.2%
        #   6000/s  100.0%             3.8%
        #   7000/s   70.0%            42.4%
        #   8000/s   65.9%             0.8%
        #
        # Benthos logged 288 connection losses against the cluster. Unique
        # devices appearing per run fell to 37-63 of 100, and p99 reached 51s.
        # Erlang distribution/mnesia state sync between three brokers on Pi 4Bs
        # appears to cost more than the extra delivery capacity buys.
        #
        # The single-broker bottleneck is real and documented (D33-D35), but the
        # remedy for it is not horizontal scaling on this hardware.
        replicaCount: 1
        # P0.3 change: NodePort -> LoadBalancer with a pinned address.
        #
        # Paper §III-C states EMQX is "exposed via MetalLB on 192.168.1.241:1883".
        # That was not true of the repository: the app previously declared
        # service.type: NodePort, which MetalLB does not assign an address to,
        # and which allocates from 30000-32767, not 1883. The orphaned
        # manifests/emqx/service-emqx.yaml (removed in P0.2) pinned nodePort 31883.
        # So the only address in the repo that claimed port 1883 on a routable
        # interface was the paper's, and it could not have been produced by the
        # declared config. See docs/alternatives-considered.md -> Open questions.
        #
        # 192.168.1.241 is inside the MetalLB pool 192.168.1.240-250
        # (files/metallb-config.yaml). Pinning it rather than auto-assigning
        # makes the broker address stable across rebuilds, which is what the
        # benchmark harness needs. VERIFY ON FIRST REBUILD: if the chart
        # version rejects loadBalancerIP, fall back to service.annotations with
        # metallb.io/loadBalancerIPs and record the deviation.
        service:
          type: LoadBalancer
          loadBalancerIP: 192.168.1.241
          annotations:
            # K3s ships a built-in LoadBalancer controller (klipper-lb, the
            # rancher svclb-* DaemonSet) AND this cluster also runs MetalLB.
            # Both watch LoadBalancer Services, and they fought over this one:
            # the events show the Service oscillating between MetalLB's
            # 192.168.1.240 and klipper-lb's node IPs (10.0.0.2-5), with
            # "invalid ips length 3" and "not allowed by config" throughout.
            #
            # MetalLB is kept, for the reason the rest of this repo depends on:
            # an explicit address pool, L2Advertisement control, and visible
            # allocation. klipper-lb only hands out node IPs, which offers no
            # control and no way to see what it decided.
            #
            # This annotation disables only the K3s controller, per Service.
            # Disabling servicelb cluster-wide (k3s config `disable:
            # - servicelb`) is the better fix and is blocked on SSH to all five
            # nodes; see docs/findings-p0.md.
            svccontroller.k3s.cattle.io/enablelb: "false"
          ports:
            mqtt: 1883
            mqtts: 8883
            ws: 8083
            wss: 8084
            dashboard: 18083
        # mqtt.max_mqueue_len: 1000 -> 10000
        #
        # Found by reading EMQX's own logs (D34). At 4000 msg/s EMQX was
        # killing Benthos connections itself:
        #
        #   check_oom_shutdown, shutdown:
        #     #{max => 1000, reason => mailbox_overflow, value => 1063}
        #   supervisor: {esockd_connection_sup,...},
        #     errorContext: connection_shutdown, reason: mailbox_overflow
        #   alarm_is_deactivated, name: runq_overload
        #
        # Each Benthos client's process mailbox filled past the default 1000
        # queued messages, so EMQX disconnected it to protect itself. Messages
        # in that mailbox were lost -- which is the 43,746-message gap between
        # messages.received (178,667) and messages.delivered (132,246) that
        # EMQX attributed to no counter at all. Only 2,675 were recorded as
        # dropped.no_subscribers.
        #
        # Benthos is the slowest stage in the path, so its mailboxes are the
        # ones that fill. 10000 gives it room to absorb a burst instead of
        # being severed from the broker mid-stream. Setting
        # clean_session: true on the Benthos side did NOT help (it was measured,
        # delivery went 74% -> 60%): the disconnects are the broker dropping a
        # slow consumer, not session state being restored.
        # Correct location is `emqxConfig`, and two earlier placements were
        # silently ignored while the Application still reported Synced:
        #
        #   1. a top-level `mqtt: {max_mqueue_len: 10000}` key -- the chart only
        #      renders recognised top-level values, so this produced no env var.
        #   2. an `env: [{name: EMQX_MQTT__MAX_MQUEUE_LEN, ...}]` list -- also
        #      not a key this chart reads.
        #
        # emqx/values.yaml documents `emqxConfig` as "EMQX configuration item"
        # holding exactly these EMQX_-prefixed names, and it is what produces
        # every entry in configmap/emqx-env.
        #
        # Worth stating plainly: the entire D34 throughput win came from raising
        # the CPU limit. This setting was NOT in effect while that was measured,
        # and the mailbox overflow was still firing at 6000 msg/s. So 100% at
        # 4000 msg/s was achieved on CPU alone, and this is headroom on top.
        # The key is `force_shutdown.max_mailbox_size`, NOT
        # `mqtt.max_mqueue_len`. The disconnects name themselves:
        #
        #   check_oom_shutdown, shutdown: #{max => 1000,
        #     reason => mailbox_overflow, value => 1063}
        #   supervisor: {esockd_connection_sup,...},
        #     errorContext: connection_shutdown
        #
        # `esockd_connection_sup` is the socket-process supervisor, so this is
        # EMQX's socket mailbox ceiling, governed by
        # `force_shutdown.max_mailbox_size` (default 1000). `mqtt.max_mqueue_len`
        # is the session's queued-message limit and changing it has no effect on
        # this path -- verified, it stayed at `max => 1000` after a restart.
        #
        # So: three wrong placements before this one, all of which the
        # Application reported as Synced while EMQX kept rejecting connections.
        # Three locations ignored in a row is the signal that the value was
        # being guessed rather than read out of the error.
        emqxConfig:
          EMQX_FORCE_SHUTDOWN__MAX_MAILBOX_SIZE: "10000"

        # cpu 500m -> 3000m, memory 512Mi -> 1024Mi.
        #
        # The 1500m/512Mi ceiling was itself the bottleneck, not EMQX. Upstream
        # benchmarks put a single EMQX node far beyond this -- order 2M msg/s and
        # millions of connections -- while this cluster stopped being lossless
        # around 6000-7000 msg/s. A difference of three orders of magnitude means
        # the limit is in how the node is provisioned, not in the broker.
        #
        # Measured node CPU under 6000 msg/s was: pi2 474m, pi3 451m, pi4 746m,
        # pi7 547m, raspberrypi 1940m of 4000m available. Three of five nodes sat
        # under 20% while delivering losslessly, so the data plane had headroom
        # and EMQX did not. Nodes have 4 cores and ~8 GB, so 3000m / 1GiB leaves
        # room for the control plane on raspberrypi, where the hot node is
        # k3s-server (~1.6 GB RSS) rather than anything in the data path.
        #
        # Kept at replicaCount 1: clustering was measured (D36) and is harmful
        # here, costing far more in Erlang distribution overhead than a third
        # broker adds.
        resources:
          limits:
            cpu: 3000m
            memory: 1024Mi
          requests:
            cpu: 500m
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: emqx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
