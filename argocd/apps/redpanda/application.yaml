apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redpanda
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/redpanda-data/helm-charts
    targetRevision: v23.2.15
    path: charts/redpanda
    helm:
      releaseName: redpanda
        # Disabled: `valuesFiles` is not a valid ArgoCD field and this file is
        # a manifest of CRs, not Helm values. This app is not in the root
        # kustomize; if it is ever enabled, inline the values as `values: |`.
  destination:
    server: https://kubernetes.default.svc
    namespace: redpanda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
