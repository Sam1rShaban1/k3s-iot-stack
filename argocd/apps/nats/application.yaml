apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nats
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://nats-io.github.io/k8s/helm/charts
    targetRevision: 2.12.5
    chart: nats
    helm:
      releaseName: nats
      values: |
        replicaCount: 1
        config:
          cluster:
            enabled: false
          jetstream:
            enabled: true
            # `sync_interval` goes under this block's `merge`, NOT directly under
            # `jetstream`. The chart renders the `jetstream` block from a fixed set of
            # known keys (enabled, fileStore, memoryStore) and silently DROPS anything
            # else -- a value placed there is ignored without any error, and the
            # Application still reports Synced. `merge` is the chart's documented way to
            # add keys to the rendered config, and the keys go in DIRECTLY: nesting them
            # under another `jetstream` key renders a jetstream-inside-jetstream, which is
            # wrong in exactly the same silent way.
            #
            # 1s, not the 2-minute default. The server reported
            # `sync_interval: 120000000000` and the measured backlog age (51.6 s median
            # at 8000 msg/s) sits inside that window. Whether the interval gates message
            # VISIBILITY is not established -- the consumer's fetch timing is what
            # settles that -- but a two-minute fsync interval is not what a
            # latency-sensitive pipeline should be running with, and the cost of 1s is
            # one fsync per second.
            merge:
              sync_interval: "1s"
            fileStore:
              enabled: true
              pvc:
                enabled: true
                # `local-path`, not `longhorn`.
                #
                # The live PVC was created with local-path, and
                # `volumeClaimTemplates` is immutable: a StatefulSet's spec only permits
                # changes to replicas, ordinals, template, updateStrategy,
                # revisionHistoryLimit, pvcRetentionPolicy and minReadySeconds. So every
                # ArgoCD sync failed with
                #
                #   StatefulSet.apps "nats" is invalid: spec: Forbidden: updates to
                #   statefulset spec for fields other than ... are forbidden
                #
                # and the nats Application sat OutOfSync with a SyncError, retrying,
                # forever. The chart version was already correct (2.12.5 on both sides)
                # -- this value was the only difference, and it was the difference.
                #
                # The alternative -- deleting the StatefulSet and its PVC so ArgoCD could
                # recreate it on longhorn -- would destroy the JetStream contents and
                # require migrating the volume. Declaring where the data already lives
                # is the only move that is both correct and safe.
                storageClassName: local-path
                size: 2Gi
            memoryStore:
              enabled: true
              maxSize: 128Mi
          mqtt:
            enabled: true
            port: 1883
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        service:
          type: ClusterIP
        nodeSelector:
          kubernetes.io/arch: arm64
        tolerations:
        - key: "arm"
          operator: "Exists"
          effect: "NoSchedule"
  destination:
    server: https://kubernetes.default.svc
    namespace: nats
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
