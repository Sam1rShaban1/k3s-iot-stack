apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nats
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://nats-io.github.io/k8s/helm/charts
    targetRevision: 2.12.5
    chart: nats
    helm:
      releaseName: nats
      values: |
        replicaCount: 1
        config:
          cluster:
            enabled: false
          jetstream:
            enabled: true
            # 1s, not the 2-minute default.
            #
            # The server reported `sync_interval: 120000000000` -- 120
            # seconds, the NATS default. The stage split measured the backlog
            # ageing in JetStream with a median of 51.6 s at 8000 msg/s, which
            # sits inside that window, so the two were worth separating. Whether
            # the sync interval actually gates message visibility is not
            # established -- the timing instrumentation in the consumer is what
            # settles it -- but a two-minute fsync interval is not something a
            # latency-sensitive pipeline should be running with, and the cost of a
            # one-second interval is one fsync per second.
            sync_interval: "1s"
            fileStore:
              enabled: true
              pvc:
                enabled: true
                # `local-path`, not `longhorn`.
                #
                # The live PVC was created with local-path, and
                # `volumeClaimTemplates` is immutable: a StatefulSet's spec only permits
                # changes to replicas, ordinals, template, updateStrategy,
                # revisionHistoryLimit, pvcRetentionPolicy and minReadySeconds. So every
                # ArgoCD sync failed with
                #
                #   StatefulSet.apps "nats" is invalid: spec: Forbidden: updates to
                #   statefulset spec for fields other than ... are forbidden
                #
                # and the nats Application sat OutOfSync with a SyncError, retrying,
                # forever. The chart version was already correct (2.12.5 on both sides)
                # -- this value was the only difference, and it was the difference.
                #
                # The alternative -- deleting the StatefulSet and its PVC so ArgoCD could
                # recreate it on longhorn -- would destroy the JetStream contents and
                # require migrating the volume. Declaring where the data already lives
                # is the only move that is both correct and safe.
                storageClassName: local-path
                size: 2Gi
            memoryStore:
              enabled: true
              maxSize: 128Mi
          mqtt:
            enabled: true
            port: 1883
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        service:
          type: ClusterIP
        nodeSelector:
          kubernetes.io/arch: arm64
        tolerations:
        - key: "arm"
          operator: "Exists"
          effect: "NoSchedule"
  destination:
    server: https://kubernetes.default.svc
    namespace: nats
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
