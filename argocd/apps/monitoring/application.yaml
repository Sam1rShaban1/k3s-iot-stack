apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/prometheus-community/helm-charts
    targetRevision: kube-prometheus-stack-55.9.0
    path: charts/kube-prometheus-stack
    helm:
      releaseName: monitoring
      parameters:
      - name: prometheusOperator.admissionWebhooks.enabled
        value: "false"
      - name: prometheusOperator.admissionWebhooks.certManager.enabled
        value: "false"
      - name: prometheusOperator.admissionWebhooks.patch.enabled
        value: "false"
      - name: alertmanager.enabled
        value: "false"
      - name: prometheusOperator.tls.enabled
        value: "false"
      - name: prometheusOperator.tlsSecret
        value: ""
      - name: grafana.sidecar.dashboards.enabled
        value: "true"
      - name: grafana.sidecar.dashboards.label
        value: grafana_dashboard
      - name: grafana.sidecar.datasources.enabled
        value: "true"
      - name: grafana.sidecar.datasources.defaultDatasourceEnabled
        value: "false"
      # Durable Prometheus storage.
      #
      # Without a storage spec the chart leaves the TSDB on an emptyDir, so
      # every pod restart destroys all infrastructure metrics. That is exactly
      # how paper 1 lost its historical metrics: the Prometheus pod was
      # terminated, the samples went with it, and nothing in the pipeline was
      # affected -- only the observability record of it.
      #
      # The field is `storage`, not `storageSpec`: this operator's CRD only
      # accepts spec.storage, and a patch naming storageSpec is accepted with
      # "unknown field" and silently discarded.
      #
      # 5 GiB on a node with ~8 GB, matching the cluster's SD cards rather than
      # the chart's much larger default, which would not fit. local-path
      # provisioner backs the claim, so this does not depend on Longhorn being
      # healthy -- which matters, because Longhorn's instance-manager image was
      # missing on three of five nodes for months.
      - name: prometheus.prometheusSpec.storage.volumeClaimTemplate.spec.accessModes
        value: ReadWriteOnce
      - name: prometheus.prometheusSpec.storage.volumeClaimTemplate.spec.resources.requests.storage
        # 10 GiB, not 5 GiB.
        #
        # The 5 GiB volume filled up and Prometheus died with
        #   panic: preallocate: no space left on device
        # which took the whole monitoring stack down (the `monitoring` Application
        # reported Degraded) while the pipeline carried on unaffected -- the
        # classic failure where the thing being measured is the thing that breaks.
        #
        # The arithmetic: 15 days of blocks came to ~3.5 GiB, and the
        # write-ahead log is allowed to grow to ~1.1 GiB before Prometheus
        # truncates it. 3.5 + 1.1 is 4.6 GiB of a 5 GiB volume, which leaves
        # nothing for the head chunks or the compaction that both need. The
        # steady state did not fit, so the volume was full and stayed full.
        #
        # Longhorn expands online, so the claim was grown in place
        # (FileSystemResizePending -> 10Gi) with no data movement. The operator
        # does not resize claims itself, so the CR is set to 10Gi here to
        # match; a StatefulSet's volumeClaimTemplates are immutable for existing
        # claims, which is why the claim itself had to be patched.
        value: 10Gi
      # 15d, so a benchmark series and the node metrics around it survive a
      # restart and can be compared across runs.
      - name: prometheus.prometheusSpec.retention
        value: 15d
      - name: prometheus.prometheusSpec.scrapeInterval
        value: 15s
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  ignoreDifferences:
  - group: "*"
    kind: "*"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
    - ServerSideApply=true
