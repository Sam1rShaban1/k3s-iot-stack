# Ansible inventory.
#
# P0.3: addresses corrected. DHCP had moved pi2 and pi7 off the 10.0.0.0/24
# range, so the previous entries pointed at addresses that no longer existed:
#
#   pi7   was 10.0.0.2  -> is  192.168.1.162
#   pi2   was 10.0.0.3  -> is  192.168.1.189
#   pi3                -> 10.0.0.4      (was absent from the inventory entirely)
#   pi4                -> 10.0.0.5      (was absent from the inventory entirely)
#
# pi3 and pi4 were running in the cluster for 137 days but had never been
# provisioned by this playbook. Addresses are verified against `kubectl get
# nodes -o wide`; re-verify after any DHCP change, because this file is the one
# place that has to be right for a re-join to succeed.
#
# k3s_node_ip is the address the node advertises to the API server. It is
# deliberately set per host rather than derived, because pi2/pi7 are on the LAN
# while pi3/pi4 are on the node network, and the advertised address must be the
# one the other nodes can actually reach.

[all:vars]
ansible_user_common: yes
# Pinned k3s release. Must match across every node. Changing it is a
# coordinated operation on all nodes, never a per-node install; see the
# version-skew note at the top of ansible/k3s-setup.yml.
k3s_version=v1.35.4+k3s1

[rpi-master]
master ansible_host=192.168.1.50 ansible_user=master k3s_node_ip=10.0.0.1

[rpi-worker]
pi7 ansible_host=192.168.1.162 ansible_user=pi7 k3s_node_ip=192.168.1.162
pi2 ansible_host=192.168.1.189 ansible_user=pi2 k3s_node_ip=192.168.1.189
pi3 ansible_host=10.0.0.4 ansible_user=pi3 k3s_node_ip=10.0.0.4
pi4 ansible_host=10.0.0.5 ansible_user=pi4 k3s_node_ip=10.0.0.5
