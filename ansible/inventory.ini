# Ansible inventory.
#
# Node addressing (2026-09-30): the wired segment 10.0.0.0/24 now carries fixed
# addresses on every node, so cluster addressing no longer depends on DHCP.
# Verified against `kubectl get nodes -o wide`; re-verify after any addressing
# change, because this file is the one place that has to be right for a
# re-join to succeed.
#
#   node          k3s_node_ip (advertised)   notes
#   raspberrypi   10.0.0.1                   control plane; also on the LAN
#                                           as 192.168.1.50, which is what
#                                           kubeconfig and the harness use
#   pi7           10.0.0.2                   restored to its original address
#                                           on this segment; it had drifted to
#                                           192.168.1.162 under DHCP
#   pi2           10.0.0.3                   previously recorded as
#                                           192.168.1.189, a DHCP address
#                                           that no longer applied
#   pi3           10.0.0.4                   was absent from this file until
#   pi4           10.0.0.5                   P0.3 despite running 137 days
#
# pi3 and pi4 had been running in the cluster for 137 days without ever being
# provisioned by this playbook.
#
# k3s_node_ip is the address the node advertises to the API server. It is set
# per host rather than derived, because it is not always the address Ansible
# reaches the node on, and the advertised address must be one the other nodes
# can actually route to.
#
# The 10.0.0.0/24 segment is not routable from a workstation on 192.168.1.0/24.
# Provisioning these nodes therefore has to run from a host on the wired
# segment, or with a route to it. This is a property of the network, not a
# defect, but it will look like "host unreachable" if it is forgotten.

[all:vars]
ansible_user_common: yes
# Pinned k3s release. Must match across every node. Changing it is a
# coordinated operation on all nodes, never a per-node install; see the
# version-skew note at the top of ansible/k3s-setup.yml.
k3s_version=v1.35.4+k3s1

[rpi-master]
master ansible_host=192.168.1.50 ansible_user=master k3s_node_ip=10.0.0.1

[rpi-worker]
pi7 ansible_host=10.0.0.2 ansible_user=pi7 k3s_node_ip=10.0.0.2
pi2 ansible_host=10.0.0.3 ansible_user=pi2 k3s_node_ip=10.0.0.3
pi3 ansible_host=10.0.0.4 ansible_user=pi3 k3s_node_ip=10.0.0.4
pi4 ansible_host=10.0.0.5 ansible_user=pi4 k3s_node_ip=10.0.0.5
