apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.1.240-192.168.1.250
  autoAssign: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-adv
  namespace: metallb-system
spec:
  ipAddressPools:
  - default-pool
  # `wlan0`, not `eth0` and not unrestricted.
  #
  # eth0 was the original value, but eth0 is the 10.0.0.0/24 fabric and the pool
  # is 192.168.1.240-250, so the speaker was advertising a home-LAN address onto
  # the fabric network.
  #
  # Removing the restriction entirely was also wrong, and measurably so: with
  # the list empty MetalLB announces on *every* interface, including `cni0` and
  # `flannel.1`. The VIP's ARP became intermittent and clients failed with
  # "No route to host" while a TCP probe taken seconds earlier had succeeded.
  # Announcing a LAN address on the CNI bridges is at best pointless and at
  # worst conflicts with the flannel fabric.
  #
  # wlan0 is the uniform LAN-facing interface. Verified per node rather than
  # assumed, from inside each host's network namespace:
  #
  #   raspberrypi  eth0 10.0.0.1/24   wlan0 192.168.1.50/24
  #   pi7          eth0 10.0.0.2/24   wlan0 192.168.1.162/24
  #   pi2          eth0 10.0.0.3/8    wlan0 192.168.1.189/24
  #
  # (pi2 is the odd one: a /8 on eth0 and a default route via 10.0.0.0, which is
  # its own network address and therefore not a usable gateway. See
  # docs/findings-p0.md.)
  interfaces:
  - wlan0
