apiVersion: v1
kind: ConfigMap
metadata:
  name: benthos-config
  namespace: benthos
data:
  benthos.yaml: |
    http:
      address: 0.0.0.0:4195
      enabled: true
    
    input:
      mqtt:
        urls:
          - tcp://emqx.emqx.svc.cluster.local:1883
        topics:
          - $share/benthos/sensors/#
        client_id: benthos-consumer-${HOSTNAME}
        qos: 1
        # clean_session: true -- explicit, because the default leaves broker-side
        # session state behind for a subscriber that reconnects dozens of times a
        # minute.
        #
        # Measured at 4000 msg/s (D33): EMQX recorded 128 sessions created and
        # 128 terminated in 45s, each replica logged 5-6 input_connection_lost,
        # and 43,746 messages vanished between messages.received (178,667) and
        # messages.delivered (132,246) that EMQX attributed to no counter at
        # all -- including only 2,675 as dropped.no_subscribers.
        #
        # Benthos is stateless here: it acks nothing upstream, resumes nothing on
        # reconnect, and holds no durable state. A persistent session buys
        # nothing and costs broker-side bookkeeping on every reconnect. QoS 0
        # means there is no in-flight window to preserve either.
        clean_session: true
        keepalive: 60

    # Stage instrumentation: stamp each message as it enters Benthos, so the
    # end-to-end latency can be split into publisher -> EMQX -> Benthos and
    # Benthos -> NATS instead of one opaque "ingest" number.
    #
    # This took three attempts, and the reason the first two failed was never
    # guessed correctly. It was measured: a probe Benthos instance subscribed to
    # `$share/probe/sensors/#` (a separate shared group, so it gets its own copy
    # and cannot steal pipeline traffic) and logged `this.type()` for real
    # publisher output. The result was `object`, not `string`.
    #
    # That one fact explains both earlier failures:
    #
    #   * `root = this.parse_json()` errored with "expected string value, got
    #     object from field 'this'" because `this` is ALREADY an object -- the
    #     MQTT input parses JSON payloads itself.
    #   * `root.benthos_entry_ts = <ts>` alone collapsed the message to a single
    #     field, because the mapping ROOT is still the raw payload even though
    #     `this` reads as an object. Assigning into raw bytes coerces it to an
    #     object holding only the assigned key, so the consumer received no
    #     device_id and stored=0 -- with every pod Running and preflight green.
    #
    # Binding `root = this` first makes the root object exist; the subsequent
    # field assignment then merges into it. Verified on the live broker: output
    # retained device_id/ts/pm1/pm25/pm10/temp/hum and gained benthos_entry_ts,
    # with entry-minus-publisher of 4-6 ms at 5 msg/s.
    #
    # Assumption: every message is a JSON object. That holds for this pipeline
    # (publisher.c is the only producer). A non-object on the shared topic would
    # be collapsed and dropped downstream rather than passed through.
    #
    # Note: `timestamp_unix_milli()` does not exist in Benthos 4.1.0; the
    # available function is `timestamp_unix_nano()`, hence the division.
    pipeline:
      processors:
        - bloblang: |
            root = this
            root.benthos_entry_ts = (timestamp_unix_nano() / 1000000).floor()

    output:
      nats:
        urls:
          - nats://10.43.203.115:4222
        subject: iot.data
        max_in_flight: 5000
        
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benthos
  namespace: benthos
spec:
  replicas: 5
  selector:
    matchLabels:
      app: benthos
  template:
    metadata:
      labels:
        app: benthos
    spec:
      containers:
      - name: benthos
        image: jeffail/benthos:4.1.0
        ports:
        - containerPort: 4195
          name: http
        volumeMounts:
        - name: config
          mountPath: /benthos.yaml
          subPath: benthos.yaml
        livenessProbe:
          httpGet:
            path: /ping
            port: 4195
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 4195
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
          limits:
            cpu: 2000m
            memory: 512Mi
      volumes:
      - name: config
        configMap:
          name: benthos-config
      affinity:
        podAntiAffinity:
          # `required`, one bridge per node across 5 nodes.
          #
          # Scaling to 10 was retried in D37 now that EMQX had 3 CPU / 1Gi
          # (see argocd/apps/emqx/application.yaml) and the system was
          # queueing rather than saturating. Two independent reasons it does
          # not work here:
          #
          #   * It does not help. A controlled 3-runs-each comparison at 5 vs
          #     10 replicas (both counts verified) showed overlapping ingest
          #     p99: 2236/3561/3356 ms at 5 against 3490/2868/2184 ms at 10.
          #
          #   * It cannot even be scheduled. Relaxing to `preferred` so the
          #     Deployment can exceed the node count leaves the surplus
          #     replicas Pending -- "5 node(s) didn't satisfy existing pods
          #     anti-affinity rules" -- and the cluster has no CPU room for
          #     them regardless: one node already sits at 112% of its CPU
          #     limit before any extra bridge is added.
          #
          # `preferred` also spreads worse than it appears. With it the
          # scheduler put all 5 replicas on pi2, the node with the most free
          # capacity, which is a worse topology than the one-per-node spread
          # this cluster is built around.
          #
          # There is a trap here worth naming, because it already caused a
          # wrong number once (D20): an over-replica-count rollout against
          # `required` anti-affinity leaves the surplus Pending rather than
          # failing. The rollout then times out, and the timeout can be
          # discarded unnoticed, so a "10 replica" measurement can silently
          # have been a 5-replica one. Always confirm the running replica
          # count before believing a scaled result.
          #
          # Schema note: `preferred` requires `weight: 1-100` and nests entries
          # under `podAffinityTerm`; `required` takes neither. Converting
          # between them without adding the weight produces a manifest ArgoCD
          # rejects wholesale rather than naming the offending field.
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: benthos
            topologyKey: kubernetes.io/hostname
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
      - key: "arm"
        operator: "Exists"
        effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: benthos
  namespace: benthos
spec:
  ports:
  - port: 4195
    targetPort: 4195
    name: http
  selector:
    app: benthos
