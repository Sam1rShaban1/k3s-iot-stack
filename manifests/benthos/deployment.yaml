apiVersion: v1
kind: ConfigMap
metadata:
  name: benthos-config
  namespace: benthos
data:
  benthos.yaml: |
    http:
      address: 0.0.0.0:4195
      enabled: true
    
    input:
      mqtt:
        urls:
          - tcp://emqx.emqx.svc.cluster.local:1883
        topics:
          - $share/benthos/sensors/#
        client_id: benthos-consumer-${HOSTNAME}
        qos: 1
        # clean_session: true -- explicit, because the default leaves broker-side
        # session state behind for a subscriber that reconnects dozens of times a
        # minute.
        #
        # Measured at 4000 msg/s (D33): EMQX recorded 128 sessions created and
        # 128 terminated in 45s, each replica logged 5-6 input_connection_lost,
        # and 43,746 messages vanished between messages.received (178,667) and
        # messages.delivered (132,246) that EMQX attributed to no counter at
        # all -- including only 2,675 as dropped.no_subscribers.
        #
        # Benthos is stateless here: it acks nothing upstream, resumes nothing on
        # reconnect, and holds no durable state. A persistent session buys
        # nothing and costs broker-side bookkeeping on every reconnect. QoS 0
        # means there is no in-flight window to preserve either.
        clean_session: true
        keepalive: 60

    # NOTE: a `benthos_entry_ts` processor was attempted here to split the
    # end-to-end latency into its stages, and it silently destroyed the
    # pipeline. The MQTT input's root is the RAW PAYLOAD BYTES, not parsed
    # JSON, so `root.benthos_entry_ts = ...` coerced the message into an object
    # containing only that one field. The consumer then received a payload with
    # no device_id and no ts, emitted a single series, and the scenario reported
    # stored=0 at 0% efficiency while every pod stayed Running and preflight
    # stayed green.
    #
    # The correct form has to parse first, something like:
    #   - bloblang: 'root = this.parse_json().assign("benthos_entry_ts", timestamp_unix_nano() / 1000000)'
    # but that is written and verified on a bench, not applied to the live
    # pipeline on the strength of one test. Enabling it is tracked as follow-up
    # work; the stage attribution it was for is answered well enough without it
    # (see docs/findings-p0.md D20).
    pipeline:
      processors: []
      # INTENTIONALLY EMPTY -- the stage-attribution processor is unresolved.
      #
      # Four forms were tried against the live pipeline. Recorded here so the
      # next attempt starts from evidence rather than from a guess:
      #
      #   root.benthos_entry_ts = <ms>
      #     Result: PIPELINE BROKEN. stored=0, devices=0, 0% efficiency, every
      #     pod Running, preflight green. Assigning to `root` here coerces the
      #     message to a single field, so the consumer receives a payload with
      #     no device_id and no ts. This is the original failure, reproduced.
      #
      #   root = this.parse_json()
      #     Result: logs `expected string value, got object from field 'this'`
      #     on every message. The pipeline still works (stored>0) because the
      #     message passes through unmodified, but no field is added. So
      #     `this` is *not* a string here, despite the error's wording.
      #
      #   root = this.parse_json().assign("k", v)
      #     Rejected by `benthos lint`: assign takes ONE argument in 4.1.0.
      #
      #   `benthos test` unit tests
      #     Pass on BOTH the working-elsewhere and the pipeline-breaking form,
      #     because the unit-test root is an object rather than what the MQTT
      #     input actually delivers. A green unit test proves nothing here.
      #
      # The contradiction -- `this` is not a string, yet assigning to root still
      # collapses the message -- is not resolved. The error text and the
      # observed behaviour disagree, and guessing has already cost two rounds.
      # Next attempt should read what the MQTT input actually delivers (a
      # `mapping: root = this` passthrough, or a Benthos `stdout`/`switch`
      # harness pointed at the live config) before changing the processor again.


    output:
      nats:
        urls:
          - nats://10.43.203.115:4222
        subject: iot.data
        max_in_flight: 5000
        
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benthos
  namespace: benthos
spec:
  # 5 -> 10 replicas.
  #
  # D37 raised the EMQX node to 3 CPU / 1Gi, which moved throughput ceiling
  # from 6000 to 8000 msg/s (lossless, confirmed across three runs). What the
  # extra throughput bought was queueing, not headroom: p99 went from 3.4s at
  # 6000 to 12-16s at 8000.
  #
  # Sampling pods under 8000 msg/s showed nothing CPU-saturated -- EMQX at
  # 14m of 3000m, and Benthos absent from the top 9 consumers entirely. So the
  # limit at 8000 is queue drain rate, not any stage's compute. Ten bridges
  # give the shared subscription more independent drains against the same
  # influx.
  replicas: 10
  selector:
    matchLabels:
      app: benthos
  template:
    metadata:
      labels:
        app: benthos
    spec:
      containers:
      - name: benthos
        image: jeffail/benthos:4.1.0
        ports:
        - containerPort: 4195
          name: http
        volumeMounts:
        - name: config
          mountPath: /benthos.yaml
          subPath: benthos.yaml
        livenessProbe:
          httpGet:
            path: /ping
            port: 4195
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 4195
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
          limits:
            cpu: 2000m
            memory: 512Mi
      volumes:
      - name: config
        configMap:
          name: benthos-config
      affinity:
        podAntiAffinity:
          # Required: one bridge per node, 5 replicas across 5 nodes.
          #
          # Relaxing this to `preferred` so the Deployment could scale past the
          # node count was tried while chasing the latency tail, and reverted.
          # Two reasons, both measured:
          #
          #   * it does not help. A controlled 3-runs-each comparison at 5 vs
          #     10 replicas (both counts verified) showed no significant
          #     difference in ingest p99 -- 2236/3561/3356 ms at 5 against
          #     3490/2868/2184 ms at 10, fully overlapping ranges.
          #   * preferred-only does not actually spread. With it, the scheduler
          #     placed all 5 replicas on pi2, the node with the most free
          #     capacity, which is a worse topology than the one-per-node spread
          #     this cluster is built around and was not the intent.
          #
          # Required anti-affinity also makes an over-replica-count experiment
          # fail loudly-ish: surplus replicas stay Pending instead of running.
          # That is a trap in its own right -- a rollout against it times out
          # rather than failing, and the timeout can be discarded unnoticed, so
          # a "10 replicas" measurement can silently be a 5-replica one. That is
          # exactly the error in D20.
          # `required` -> `preferred`.
          #
          # Required anti-affinity (one bridge per node) caps this Deployment at
          # exactly 5 replicas on a 5-node cluster, so it cannot be scaled to
          # test drain rate at all. Preferred keeps the spread preference -- the
          # scheduler will still place one per node first -- while allowing
          # surplus bridges to co-locate once every node holds one.
          # `weight: 100` is mandatory under `preferred` and absent under
          # `required` -- that schema difference made the first version of this
          # change unappliable, and ArgoCD reported the whole sync as Failed
          # rather than naming the field.
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: benthos
              topologyKey: kubernetes.io/hostname
              namespaceSelector:
                matchLabels:
                  name: benthos
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
      - key: "arm"
        operator: "Exists"
        effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: benthos
  namespace: benthos
spec:
  ports:
  - port: 4195
    targetPort: 4195
    name: http
  selector:
    app: benthos
