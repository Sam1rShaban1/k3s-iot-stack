# MetalLB address pool and L2 advertisement for LAN-facing Services.
#
# These were previously passed to the `metallb` Helm chart via
# `spec.source.helm.valuesFiles` in argocd/apps/metallb/application.yaml. That
# could never work, for two independent reasons:
#
#   * The ArgoCD field is `valueFiles`, not `valuesFiles`. (The same typo was
#     independently present in argocd/apps/victoriametrics/application.yaml --
#     see D38.)
#   * More fundamentally, this file is not a Helm values file at all. It is a
#     multi-document manifest containing IPAddressPool and L2Advertisement
#     custom resources. Handing CRs to Helm as values does nothing.
#
# The live Application had only `{"releaseName": "metallb"}`, so the pool was
# never created even once the chart installed cleanly. With no pool, the EMQX
# Service of type LoadBalancer had no address assigned at all:
#
#   $ kubectl get svc emqx -n emqx -o jsonpath='{.status.loadBalancer.ingress}'
#   (empty)
#
# which made 192.168.1.241 belong to nobody. Clients dialling it got an ARP
# failure that only resolved into a ~3s TCP connect timeout -- the "MetalLB is
# mysteriously slow" symptom. It was never slow; it was absent.
#
# A Helm-only Application source cannot also apply plain repo manifests, so
# these CRs are applied as manifests by the root kustomize
# (argocd/apps/kustomization.yaml) alongside manifests/namespaces.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.1.240-192.168.1.250
  autoAssign: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-adv
  namespace: metallb-system
spec:
  ipAddressPools:
  - default-pool
  # `wlan0`, not `eth0` and not unrestricted.
  #
  # eth0 was the original value, but eth0 is the 10.0.0.0/24 fabric and the pool
  # is 192.168.1.240-250, so the speaker was advertising a home-LAN address onto
  # the fabric network.
  #
  # Removing the restriction entirely was also wrong, and measurably so: with
  # the list empty MetalLB announces on *every* interface, including `cni0` and
  # `flannel.1`. The VIP's ARP became intermittent and clients failed with
  # "No route to host" while a TCP probe taken seconds earlier had succeeded.
  # Announcing a LAN address on the CNI bridges is at best pointless and at
  # worst conflicts with the flannel fabric.
  #
  # wlan0 is the uniform LAN-facing interface. Verified per node rather than
  # assumed, from inside each host's network namespace:
  #
  #   raspberrypi  eth0 10.0.0.1/24   wlan0 192.168.1.50/24
  #   pi7          eth0 10.0.0.2/24   wlan0 192.168.1.162/24
  #   pi2          eth0 10.0.0.3/8    wlan0 192.168.1.189/24
  #
  # (pi2 is the odd one: a /8 on eth0 and a default route via 10.0.0.0, which is
  # its own network address and therefore not a usable gateway. See
  # docs/findings-p0.md.)
  interfaces:
  - wlan0
