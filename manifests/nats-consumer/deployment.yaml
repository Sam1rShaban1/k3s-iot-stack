apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats-consumer
  namespace: nats-consumer
spec:
  # 10 replicas.
  #
  # The consumer is the component the pipeline is actually limited by, and it
  # is limited on serial work per replica: one fetch/parse/write loop in one
  # event loop. Measured (D54): 3 replicas sustained ~3000 msg/s, 6 sustained
  # ~5800 msg/s, with no node above 21% CPU. So the lever is replicas of the
  # saturated component, not faster nodes.
  #
  # The anti-affinity is `preferred`, not `required`, so 10 replicas spread
  # over 5 nodes with two per node. That is deliberate: the consumer is not
  # CPU-bound, so co-location costs nothing, and `required` would leave the
  # surplus unschedulable -- exactly what happened to the 10-replica Benthos
  # attempt in D37.
  replicas: 10
  selector:
    matchLabels:
      app: nats-consumer
  template:
    metadata:
      labels:
        app: nats-consumer
      # The volume below references the ConfigMap by its base name. kustomize
      # rewrites that reference to the generated content-hashed name, which is
      # what makes an edit to consumer.py change this pod template and produce
      # a real rollout. Do not pin a name here, or the linkage is broken.
    spec:
      containers:
        - name: nats-consumer
          image: 192.168.1.50:30500/nats-consumer:python
          imagePullPolicy: IfNotPresent
          command: ["python3", "-u", "/opt/consumer/consumer.py"]
          env:
            - name: NATS_URL
              value: "nats://nats.nats.svc.cluster.local:4222"
            - name: VICTORIA_METRICS_URL
              value: "http://victoriametrics-victoria-metrics-single-server.victoriametrics.svc.cluster.local:8428/api/v1/import/prometheus"
            - name: BATCH_SIZE
              value: "5000"
            # P0.4: BATCH_TIMEOUT removed. The previous consumer never read it --
            # it drained on every incoming message. See the header note in
            # configmap.yaml. Draining is now a single polling path in
            # batch_sender(), chunked by BATCH_SIZE.
            - name: MAX_CONCURRENT_SENDS
              value: "32"
            # The three stage series (benthos_entry_ts, nats_exit_ts,
            # consumer_queue_ms) are 3 of the 11 series written per message.
            # They are what makes the latency attribution possible, so they
            # are on by default; a pure throughput measurement can turn them
            # off and give the write path ~27% less to do.
            - name: EMIT_STAGE_METRICS
              value: "1"
            - name: WRITE_TIMEOUT_S
              value: "30"
            # P0.6: pull consumer. A shared durable lets all replicas consume;
            # the previous push consumer allowed only one bound subscription,
            # so 2 of 3 replicas silently did nothing.
            - name: CONSUMER_DURABLE
              value: "metrics-consumer-pull"
            # How long a pull fetch waits for a full BATCH_SIZE before
            # returning whatever has arrived. This is the dominant term in
            # measured end-to-end latency: with 1.0 the reported p99 was 993 ms
            # and the distribution was a flat ramp from 10 ms to 1 s, which
            # describes the fetch cadence rather than the pipeline. At 0.05 a
            # partial batch returns promptly and batching still amortises the
            # VictoriaMetrics write. See docs/findings-p0.md D11.
            - name: FETCH_TIMEOUT_S
              value: "0.05"
            - name: ACK_WAIT_S
              value: "60"
            - name: MAX_ACK_PENDING
              value: "10000"
            - name: MAX_DELIVER
              value: "-1"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 512Mi
          volumeMounts:
            - name: consumer-script
              mountPath: /opt/consumer
      volumes:
        - name: consumer-script
          configMap:
            name: nats-consumer-script
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: nats-consumer
              topologyKey: kubernetes.io/hostname
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
        - key: "arm"
          operator: "Exists"
          effect: "NoSchedule"
