apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats-consumer
  namespace: nats-consumer
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nats-consumer
  template:
    metadata:
      labels:
        app: nats-consumer
    spec:
      containers:
        - name: nats-consumer
          image: 192.168.1.50:30500/nats-consumer:python
          imagePullPolicy: IfNotPresent
          command: ["python3", "-u", "/opt/consumer/consumer.py"]
          env:
            - name: NATS_URL
              value: "nats://nats.nats.svc.cluster.local:4222"
            - name: VICTORIA_METRICS_URL
              value: "http://victoriametrics-victoria-metrics-single-server.victoriametrics.svc.cluster.local:8428/api/v1/import/prometheus"
            - name: BATCH_SIZE
              value: "5000"
            # P0.4: BATCH_TIMEOUT removed. The previous consumer never read it --
            # it drained on every incoming message. See the header note in
            # configmap.yaml. Draining is now a single polling path in
            # batch_sender(), chunked by BATCH_SIZE.
            - name: MAX_CONCURRENT_SENDS
              value: "32"
            - name: WRITE_TIMEOUT_S
              value: "30"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 512Mi
          volumeMounts:
            - name: consumer-script
              mountPath: /opt/consumer
      volumes:
        - name: consumer-script
          configMap:
            name: nats-consumer-script
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: nats-consumer
              topologyKey: kubernetes.io/hostname
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
        - key: "arm"
          operator: "Exists"
          effect: "NoSchedule"
